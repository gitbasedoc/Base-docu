{% extends "base.html" %}

{% block title %}Page non trouvée - KB Support Basedoc{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">Page non trouvée</div>
        <div class="error-message">
            <p>La page que vous recherchez n'existe pas ou a été déplacée.</p>
        </div>
        <div class="error-actions">
            <a href="{{ url_for('procedures.home') }}" class="btn btn-primary">
                <span class="btn-icon">🏠</span>
                Retour à l'accueil
            </a>
            <a href="{{ url_for('procedures.list_procedures') }}" class="btn btn-secondary">
                <span class="btn-icon">📋</span>
                Liste des procédures
            </a>
        </div>
    </div>
</div>

<style>
.error-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 2rem;
}

.error-container {
    text-align: center;
    max-width: 600px;
}

.error-code {
    font-size: 8rem;
    font-weight: 700;
    color: var(--primary-color);
    font-family: 'Fira Code', monospace;
    line-height: 1;
    margin-bottom: 1rem;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
}

.error-title {
    font-size: 2rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 1rem;
}

.error-message {
    font-size: 1.1rem;
    color: var(--text-secondary);
    margin-bottom: 2rem;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

.error-actions .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}
</style>
{% endblock %}
